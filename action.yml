
name: 'Container Security Scan'
description: 'Builds a Docker image and performs a security scan using Trivy.'

inputs:
  registry:
    description: 'Docker registry to use'
    required: false
    default: 'ghcr.io'
  dockerfile:
    description: 'Path to the Dockerfile'
    required: true
  context:
    description: 'Context for Docker build'
    required: false
    default: '.'
  image_name:
    description: 'Name of the Docker image'
    required: true
  env_file:
    description: 'Path to the .env file (optional)'
    required: false
  output_path:
    description: 'Output path for the Trivy report'
    required: true
  cleanup_path:
    description: 'Path for cleaning up Trivy report'
    required: false
    default: '.'
  watchtower_path:
    description: 'Path for watchtower for Trivy report'
    required: true
  npmrc_content:
    description: 'Contents of the .npmrc file (optional)'
    required: false 
  build_args:
    description: 'Contents of the .npmrc file (optional)'
    required: false
    default: ''
  base-image:
    description: 'Base image for the Docker build'
    required: false
    default: ""
  severity:
    description: 'Comma-separated severities included in the Trivy report'
    required: false
    default: 'CRITICAL,HIGH'

outputs:
  total:
    description: 'Total number of findings'
    value: ${{ steps.layer-report.outputs.total }}
  fixable:
    description: 'Number of vulnerabilities with a published fix'
    value: ${{ steps.layer-report.outputs.fixable }}
  image_level:
    description: 'Number of findings attributed to the base image'
    value: ${{ steps.layer-report.outputs.image_level }}
  app_level:
    description: 'Number of findings attributed to application layers'
    value: ${{ steps.layer-report.outputs.app_level }}
  os_level:
    description: 'Number of findings attributed to OS packages'
    value: ${{ steps.layer-report.outputs.os_level }}
  app_dep_level:
    description: 'Number of findings attributed to application dependencies (npm, jar, pip, go)'
    value: ${{ steps.layer-report.outputs.app_dep_level }}
  critical:
    description: 'Number of critical findings'
    value: ${{ steps.layer-report.outputs.critical }}
  high:
    description: 'Number of high findings'
    value: ${{ steps.layer-report.outputs.high }}
  medium:
    description: 'Number of medium findings'
    value: ${{ steps.layer-report.outputs.medium }}
  low:
    description: 'Number of low findings'
    value: ${{ steps.layer-report.outputs.low }}
  unknown:
    description: 'Number of findings with unknown severity'
    value: ${{ steps.layer-report.outputs.unknown }}

runs:
  using: 'composite'
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Pull LFS files
      run: git lfs pull
      shell: bash

    - name: Load and Create New .env File
      if: ${{ inputs.env_file }}
      run: |
        echo "Loading .env file from ${{ inputs.env_file }}"
        # Read the existing env_file and process its contents
        while IFS= read -r line; do
          # Optionally, process each line here if needed
          echo "$line" >> new.env
        done < "${{ inputs.env_file }}"
        echo "New .env file created as new.env"
      shell: bash

    - name: Set lowercase image name
      run: |
        # Convert the image name to lowercase
        IMAGE_NAME=$(echo "${{ inputs.image_name }}" | tr '[:upper:]' '[:lower:]')
        echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
      shell: bash
      
    - name: Create .npmrc File from Content
      if: ${{ inputs.npmrc_content }}
      run: |
        echo "Creating .npmrc file from input content"
        echo "${{ inputs.npmrc_content }}" > .npmrc
        echo ".npmrc file created from input content"
      shell: bash

    - name: Contents of .npmrc
      if: ${{ inputs.npmrc_content }}
      run: cat .npmrc
      shell: bash

    - name: Docker build
      run: docker build -f ${{ inputs.dockerfile }} -t ${{ env.IMAGE_NAME }} ${{ inputs.build_args }} ${{ inputs.context }}
      shell: bash

    - name: Create Output Folder
      env:
        REPORT_HTML: ${{ inputs.output_path }}
      run: mkdir -p "$(dirname "$REPORT_HTML")"
      shell: bash

    - name: Run security scan on the container
      uses: aquasecurity/trivy-action@v0.36.0
      id: scan
      with:
        image-ref: ${{ env.IMAGE_NAME }}
        format: json
        output: trivy-report.json
        severity: 'CRITICAL,HIGH'
        timeout: 20m
      env:
        TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
        TRIVY_TIMEOUT: 20m

    - name: Collect base image layer IDs
      if: ${{ inputs.base-image != '' }}
      shell: bash
      env:
        BASE_IMAGE: ${{ inputs.base-image }}
      run: |
        docker image inspect "$BASE_IMAGE" > /dev/null 2>&1 || docker pull "$BASE_IMAGE"
        docker image inspect "$BASE_IMAGE" --format '{{json .RootFS.Layers}}' > trivy-report-base-diffids.json

    - name: Layer report
      id: layer-report
      shell: bash
      env:
        REPORT_JSON: trivy-report.json
        REPORT_HTML: ${{ inputs.output_path }}
        REPORT_BASE_DIFFIDS: trivy-report-base-diffids.json
        BASE_IMAGE: ${{ inputs.base-image }}
        REPORT_TARGET: ${{ env.IMAGE_NAME }}
        REPORT_SEVERITY: ${{ inputs.severity }}
        REPORT_EXIT_CODE: "0"
      run: python3 "${{ github.action_path }}/trivy-report.py"

    - name: Use the Upload Artifact GitHub Action
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.IMAGE_NAME }}-cs-report
        path: ${{ inputs.output_path }}

    - name: Remove previous Trivy report
      run: rm -rf ${{ inputs.cleanup_path }}
      shell: bash

    - name: Download artifacts to the computer
      uses: actions/download-artifact@v4
      with:
        name: ${{ env.IMAGE_NAME }}-cs-report
        path: ${{ inputs.watchtower_path }}
